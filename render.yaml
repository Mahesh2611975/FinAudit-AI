# Render Blueprint for the FinAudit AI backend.
# Deploy via: Render Dashboard → Blueprints → New Blueprint Instance → this repo.
# Secret values (database URL, JWT signing secret, inference host) are set in
# the Render dashboard and are intentionally not stored in source control.
# The backend requires FINAUDIT_JWT_SECRET outside local environments.
services:
  - type: web
    name: finaudit-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    contextDir: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # Explicitly non-local: missing/weak JWT secrets fail startup and auth.
      - key: FINAUDIT_ENV
        value: production
      # Local demo sessions are always refused in production; keep this explicit.
      - key: FINAUDIT_LOCAL_DEMO_MODE
        value: "false"
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      # Minimum 32 random characters. Set in the dashboard; never commit it.
      - key: FINAUDIT_JWT_SECRET
        sync: false
      # PostgreSQL (e.g. Neon). Set in the dashboard; never commit the value.
      - key: FINAUDIT_DATABASE_URL
        sync: false
      # Comma-separated Vercel frontend origin(s), e.g. https://finaudit-abc.vercel.app
      - key: FINAUDIT_CORS_ORIGINS
        sync: false
      # Hosted Ollama-compatible inference endpoint reachable from Render.
      # If unreachable, deterministic rules and evidence-only answers still work.
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:1b
      - key: OLLAMA_TIMEOUT
        value: "20"
      - key: OLLAMA_PROBE_TIMEOUT
        value: "1.5"
      - key: FINAUDIT_GEOCODING_ENABLED
        value: "false"
      - key: FINAUDIT_GEOCODING_MAX_LOOKUPS
        value: "10"
